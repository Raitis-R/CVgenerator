{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4 form-box">
        <h1 class="h4 mb-4">{{ title }}</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Saglabāt</button>
          <a class="btn btn-outline-secondary" href="{{ back_url }}">Atcelt</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
