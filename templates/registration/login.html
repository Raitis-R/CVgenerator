{% extends "base.html" %}

{% block title %}Ieiet{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4 form-box">
        <h1 class="h3 mb-3">Ieiet sistēmā</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Ieiet</button>
        </form>
        <p class="mt-3 mb-0 text-center small">
          Nav konta? <a href="{% url 'register' %}">Reģistrēties</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
